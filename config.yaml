zeitraum:
  # Modi: "vormonat", "aktueller_monat", "aktuelles_jahr", "manuell"
  # Bei "manuell": datum_von und datum_bis angeben (Format: TT.MM.JJJJ)
  modus: "aktuelles_jahr"
  datum_von: "01.01.2026"   # nur relevant bei modus: "manuell"
  datum_bis: "31.12.2026"   # nur relevant bei modus: "manuell"

# Zielordner für heruntergeladene und verarbeitete Dateien
ausgabe_ordner: "~/Downloads/qis_downloads"

# Browser sichtbar anzeigen? (nur für Fehlersuche auf true setzen)
debug_browser: false
